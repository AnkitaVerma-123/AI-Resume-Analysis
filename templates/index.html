<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="header">

        <h1>AI Resume Analyzer</h1>

        <p>Smart Resume Screening System</p>

    </header>


    <div class="container">

        <div class="card">

            <h2>Welcome</h2>

            <p>
                Upload your resume and get ATS Score,
                Skill Analysis, Missing Skills and
                Resume Suggestions.
            </p>


            <!-- Resume Upload Form -->

            <form action="/analyze"
                  method="POST"
                  enctype="multipart/form-data">

                <input type="file"
                       name="resume"
                       accept=".pdf,.docx"
                       required>

                <br><br>

                <button type="submit">
                    Analyze Resume
                </button>

            </form>

        </div>

    </div>

</body>

</html>
